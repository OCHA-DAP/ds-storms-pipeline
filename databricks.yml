# Databricks Asset Bundle — source-controlled definition of the NHC
# pipeline job.
#
#   databricks bundle validate -t dev -p default
#   databricks bundle deploy   -t dev -p default
#   databricks bundle run nhc_pipeline -t dev -p default
#
# Bundle docs: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: ds-storms-pipeline

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: default
    variables:
      mode: dev
  prod:
    mode: production
    workspace:
      profile: default
    variables:
      mode: prod

variables:
  mode:
    description: Pipeline --mode (dev | prod)
    default: dev
  # The git branch the cluster pulls run_pipeline.py from. Switch to
  # "main" once your branch merges.
  git_branch:
    description: Branch to pull run_pipeline.py from
    default: wsp-adm0-exp
  # Interactive cluster the task runs on. Look up via
  # `databricks clusters list -p default --cluster-sources UI,API`.
  existing_cluster_id:
    description: ID of the interactive cluster
    default: "0515-161935-i2w5mxhc"

# =====================================================================
# Single job for both realtime AND backfill. The cron schedule fires
# with all parameters at their defaults → nhc-realtime against prod.
# To backfill or re-run anything: click "Run now with different
# parameters" in the UI and override `subcommand` (e.g.
# nhc-wsp-fcastonly-exp) + whichever filter applies (year, since,
# issued_time). The thin dispatcher at databricks/dispatch.py turns
# the parameter values into a normal `python run_pipeline.py …`
# invocation, so behaviour matches local CLI exactly.
# =====================================================================
resources:
  jobs:
    nhc_pipeline:
      name: NHC Pipeline
      # Pull run_pipeline.py + src/ from this git ref. Same model as
      # the existing "Run NHC" job (266763033249426).
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-storms-pipeline.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # Realtime cron: minute 0, every 3 hours UTC.
      schedule:
        quartz_cron_expression: "0 0 0/3 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      # Job parameters appear in the DBX UI as a form when you click
      # "Run now with different parameters". Cron runs use the defaults.
      parameters:
        - name: subcommand     # which run_pipeline.py subcommand
          default: nhc-realtime
        - name: mode           # dev | prod
          default: ${var.mode}
        - name: issued_time    # YYYY-MM-DDTHH (single advisory)
          default: ""
        - name: since          # YYYY-MM-DD (date lower bound)
          default: ""
        - name: year           # YYYY (year-chunked exposure pipelines)
          default: ""
        - name: overwrite      # "true" to pass --overwrite
          default: ""
        - name: fill_nulls     # "true" to pass --fill-nulls (matched only)
          default: ""

      tasks:
        - task_key: run
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: databricks/dispatch.py
            source: GIT
            parameters:
              - "{{job.parameters.subcommand}}"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.since}}"
              - "{{job.parameters.year}}"
              - "{{job.parameters.overwrite}}"
              - "{{job.parameters.fill_nulls}}"
          libraries:
            - pypi: { package: "ocha-stratus" }
            - pypi:
                package: "ocha-lens @ git+https://github.com/OCHA-DAP/ocha-lens.git@wsp-exp-calc"
            - pypi: { package: "python-dotenv" }
            - pypi: { package: "geopandas" }
            - pypi: { package: "rasterio" }
            - pypi: { package: "rioxarray" }
            - pypi: { package: "coloredlogs" }
            - pypi: { package: "tqdm" }
            - pypi: { package: "geoalchemy2" }
