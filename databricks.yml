# Databricks Asset Bundle — source-controlled definition of the NHC
# realtime job. Deploy with:
#
#   databricks bundle deploy -t prod        # or -t dev
#   databricks bundle run nhc_realtime -t prod
#
# Asset Bundles are the "GHA-style YAML in the repo" answer to defining
# Databricks jobs declaratively. The bundle owns the job spec, the
# schedule, the cluster, and (importantly here) the library deps for
# each task — no more clicking around the UI.
#
# Docs: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: ds-storms-pipeline

# ---------------------------------------------------------------------
# Per-environment overrides. Use -t <target> at deploy/run time.
# ---------------------------------------------------------------------
# workspace.host does NOT support ${var.…} interpolation. Hardcode it
# per target (preferred) — OR omit the `workspace:` block entirely and
# let the CLI resolve the host from your `databricks auth login`
# profile / DATABRICKS_HOST env var.
targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: default
    variables:
      mode: dev
  prod:
    mode: production
    workspace:
      profile: default
    variables:
      mode: prod

variables:
  mode:
    description: Pipeline --mode (dev | prod)
    default: dev
  # The ocha-lens git ref that has the new strict matcher + containment
  # fallback + schemas. Pin until merged to main.
  ocha_lens_ref:
    description: ocha-lens git ref to install
    default: wsp-exp-calc
  # Job clusters (spun up per-run, ephemeral) — defined below. No
  # existing_cluster_id needed.

# ---------------------------------------------------------------------
# Shared cluster config + library list reused by every task.
#
# Defining the library list once here means you don't enter dependencies
# manually per task in the UI — the deploy step applies them everywhere.
# ---------------------------------------------------------------------
resources:
  jobs:
    nhc_realtime:
      name: NHC Realtime (${var.mode})
      # Run every 30 min on the :15 and :45 (advisories drop at :00 and
      # WSPs land ~3h later — this catches both within an hour).
      schedule:
        quartz_cron_expression: "0 15,45 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      # ---------------------------------------------------------------- #
      # Ephemeral job cluster — created per run, terminated when the job
      # ends. Defined once here and referenced from every task via
      # job_cluster_key. Mirrors the workspace cluster spec the user runs
      # interactively (policy 000C79D951EAF0D6, 17.3.x runtime, DS3_v2,
      # spot with fallback).
      #
      # The policy fixes several fields (FLOODSCAN_*_URL, GH_FLOODSCAN_TOKEN,
      # num_workers, …) — those are deliberately omitted here so
      # apply_policy_default_values=true can inject them at run time. Any
      # field listed below either has no policy rule or matches the policy's
      # fixed value exactly.
      # ---------------------------------------------------------------- #
      job_clusters:
        - job_cluster_key: storms_cluster
          new_cluster:
            policy_id: "000C79D951EAF0D6"
            apply_policy_default_values: true
            spark_version: "17.3.x-scala2.13"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            data_security_mode: LEGACY_SINGLE_USER_STANDARD
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
            spark_env_vars:
              # Pipeline + storage
              STORAGE_ACCOUNT_DEV: imb0chd0dev
              STORAGE_ACCOUNT_PROD: imb0chd0prod
              CONTAINER_RASTER: raster
              CONTAINER_GLOBAL: global
              PYSPARK_PYTHON: /databricks/python3/bin/python3
              # Postgres (dev + prod)
              DSCI_AZ_DB_DEV_HOST: "{{secrets/dsci/DSCI_AZ_DB_DEV_HOST}}"
              DSCI_AZ_DB_DEV_UID: "{{secrets/dsci/DSCI_AZ_DB_DEV_UID}}"
              DSCI_AZ_DB_DEV_PW: "{{secrets/dsci/DSCI_AZ_DB_DEV_PW}}"
              DSCI_AZ_DB_DEV_UID_WRITE: "{{secrets/dsci/DSCI_AZ_DB_DEV_UID_WRITE}}"
              DSCI_AZ_DB_DEV_PW_WRITE: "{{secrets/dsci/DSCI_AZ_DB_DEV_PW_WRITE}}"
              DSCI_AZ_DB_PROD_HOST: "{{secrets/dsci/DSCI_AZ_DB_PROD_HOST}}"
              DSCI_AZ_DB_PROD_UID: "{{secrets/dsci/DSCI_AZ_DB_PROD_UID}}"
              DSCI_AZ_DB_PROD_PW: "{{secrets/dsci/DSCI_AZ_DB_PROD_PW}}"
              DSCI_AZ_DB_PROD_UID_WRITE: "{{secrets/dsci/DSCI_AZ_DB_PROD_UID_WRITE}}"
              DSCI_AZ_DB_PROD_PW_WRITE: "{{secrets/dsci/DSCI_AZ_DB_PROD_PW_WRITE}}"
              # Azure blob SAS tokens
              DSCI_AZ_BLOB_DEV_SAS: "{{secrets/dsci/DSCI_AZ_BLOB_DEV_SAS}}"
              DSCI_AZ_BLOB_DEV_SAS_WRITE: "{{secrets/dsci/DSCI_AZ_BLOB_DEV_SAS_WRITE}}"
              DSCI_AZ_BLOB_PROD_SAS: "{{secrets/dsci/DSCI_AZ_BLOB_PROD_SAS}}"
              DSCI_AZ_BLOB_PROD_SAS_WRITE: "{{secrets/dsci/DSCI_AZ_BLOB_PROD_SAS_WRITE}}"
              # AWS (for ECMWF / hdx-pa-ecmwf bucket)
              AWS_ACCESS_KEY_ID: "{{secrets/dsci/AWS_ACCESS_KEY_ID}}"
              AWS_SECRET_ACCESS_KEY: "{{secrets/dsci/AWS_SECRET_ACCESS_KEY}}"
              AWS_DEFAULT_REGION: us-east-1
              AWS_BUCKET_NAME: hdx-pa-ecmwf
              # ECMWF API
              ECMWF_API_URL: https://api.ecmwf.int/v1
              ECMWF_API_EMAIL: leonardo.milano@un.org
              ECMWF_API_KEY: "{{secrets/dsci/ECMWF_API_KEY}}"
              # CDS / ERA5
              CDSAPI_URL: https://cds.climate.copernicus.eu/api
              CDSAPI_KEY: "{{secrets/dsci/CDSAPI_KEY}}"
              # IMERG
              IMERG_USERNAME: "{{secrets/dsci/IMERG_USERNAME}}"
              IMERG_PASSWORD: "{{secrets/dsci/IMERG_PASSWORD}}"
              # FLOODSCAN_*_URL and GH_FLOODSCAN_TOKEN are deliberately
              # omitted — the policy fixes them, and apply_policy_default_values
              # will inject them at run time.

      # Job-level parameters available as {{job.parameters.X}} in tasks.
      parameters:
        - name: mode
          default: ${var.mode}

      tasks:
        # ============================================================ #
        # A. ETL — scrape CurrentStorms.json + WSP, write raw tables,
        #    emit (track_issued_time, wsp_issued_time) as task values.
        # ============================================================ #
        - task_key: etl
          job_cluster_key: storms_cluster
          notebook_task:
            notebook_path: ./databricks/notebooks/01_etl.py
            base_parameters:
              mode: "{{job.parameters.mode}}"
          libraries: &storm_libs
            - pypi: { package: "ocha-stratus" }
            - pypi:
                package: "ocha-lens @ git+https://github.com/OCHA-DAP/ocha-lens.git@${var.ocha_lens_ref}"
            - pypi: { package: "python-dotenv" }
            - pypi: { package: "geopandas" }
            - pypi: { package: "rasterio" }
            - pypi: { package: "rioxarray" }
            - pypi: { package: "coloredlogs" }
            - pypi: { package: "tqdm" }

        # ============================================================ #
        # B. Tracks processing — fcast/obsv/fcastonly buffers, one run
        #    each, scoped to the issued_time emitted by A.
        # ============================================================ #
        - task_key: tracks_processing
          job_cluster_key: storms_cluster
          depends_on: [{ task_key: etl }]
          notebook_task:
            notebook_path: ./databricks/notebooks/02_tracks_processing.py
            base_parameters:
              mode: "{{job.parameters.mode}}"
              issued_time: "{{tasks.etl.values.track_issued_time}}"
          libraries: *storm_libs

        # ============================================================ #
        # C. Tracks exposure — three exposure tables off the buffers.
        # ============================================================ #
        - task_key: tracks_exposure
          job_cluster_key: storms_cluster
          depends_on: [{ task_key: tracks_processing }]
          notebook_task:
            notebook_path: ./databricks/notebooks/03_tracks_exposure.py
            base_parameters:
              mode: "{{job.parameters.mode}}"
              issued_time: "{{tasks.etl.values.track_issued_time}}"
          libraries: *storm_libs

        # ============================================================ #
        # D. WSP processing — matched table + fcastonly clipping. Needs
        #    obsv buffers from B, so depends on tracks_processing.
        # ============================================================ #
        - task_key: wsp_processing
          job_cluster_key: storms_cluster
          depends_on: [{ task_key: tracks_processing }]
          notebook_task:
            notebook_path: ./databricks/notebooks/04_wsp_processing.py
            base_parameters:
              mode: "{{job.parameters.mode}}"
              wsp_issued_time: "{{tasks.etl.values.wsp_issued_time}}"
          libraries: *storm_libs

        # ============================================================ #
        # E. WSP exposure — full WSP exp + fcastonly WSP exp.
        # ============================================================ #
        - task_key: wsp_exposure
          job_cluster_key: storms_cluster
          depends_on: [{ task_key: wsp_processing }]
          notebook_task:
            notebook_path: ./databricks/notebooks/05_wsp_exposure.py
            base_parameters:
              mode: "{{job.parameters.mode}}"
              wsp_issued_time: "{{tasks.etl.values.wsp_issued_time}}"
          libraries: *storm_libs
