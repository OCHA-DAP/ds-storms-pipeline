# Databricks Asset Bundle — ONE bundle (`ds-storms-pipeline`) defining FOUR
# independent jobs:
#
#   • nhc_pipeline        — NHC tracks + WSP exposure (5 chained tasks),
#                           dispatched via databricks/dispatch.py
#   • gdacs_adam_pipeline — GDACS→ADAM→match cascade (3 chained tasks),
#                           dispatched via databricks/dispatch_gdacs_adam.py
#   • ibtracs_pipeline    — daily IBTrACS best-track ETL (single task),
#                           run_pipeline.py ibtracs
#   • ecmwf_pipeline      — daily ECMWF forecast-track ETL (single task),
#                           run_pipeline.py ecmwf
#
# The two jobs stay separate in the Workflows UI (own DAG / schedule /
# compute). "One bundle" just means one databricks.yml deploys both.
#
#   databricks bundle validate -t dev  -p DEFAULT
#   databricks bundle deploy   -t dev  -p DEFAULT
#   databricks bundle run {nhc_pipeline|gdacs_adam_pipeline} -t dev -p DEFAULT
#
# Bundle docs: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: ds-storms-pipeline

variables:
  mode:
    description: Pipeline --mode (dev | prod)
    default: dev
  git_branch:
    description: Branch the cluster pulls run_pipeline.py / dispatchers from
    default: main
  existing_cluster_id:
    description: Interactive cluster the NHC tasks run on
    default: "0515-161935-i2w5mxhc"
  dev_cluster_id:
    description: Interactive cluster the GDACS/ADAM dev tasks run on
    default: "0604-214501-kq22m39c"   # zarno GDACS-ADAM dev (isolated lib env)
  cuba_forecast_job_id:
    description: >-
      Job ID the post-ETL trigger fires (fire-and-forget). Empty string
      => the trigger task no-ops. Defaults to the shared (un-prefixed)
      Cuba Hurricane Forecast Monitor, which runs `main` and has no
      schedule of its own — so every NHC deploy kicks the same canonical
      monitor. Override per target only if a deploy must hit a different
      one.
    default: "527252598381643"   # Cuba Hurricane Forecast Monitor (shared, runs main)
  hti_monitoring_job_id:
    description: >-
      Job ID the post-exposure trigger fires (fire-and-forget). Empty
      string => the trigger task no-ops. Defaults to the shared HTI
      Hurricane Monitoring job (ds-aa-hti-hurricanes bundle, runs main),
      which also has its own :50 cron as a fallback.
    default: "586426884912849"   # HTI Hurricane Monitoring (shared, runs main)

resources:
  jobs:

    # ===================================================================
    # NHC pipeline — 5 chained tasks (etl → tracks_processing →
    # {tracks_exposure, wsp_processing → wsp_exposure}). Dispatches via
    # databricks/dispatch.py. Compute is supplied per target below
    # (dev: personal interactive cluster; prod: ephemeral Job Compute).
    # ===================================================================
    nhc_pipeline:
      name: NHC Pipeline
      # Job-scoped (NOT top-level) permission: this workspace tier has
      # directory ACLs disabled, so a bundle-wide permission fails on the
      # deployment folder. dsci members (incl. Tristan) can see/run/manage it.
      permissions:
        - group_name: dsci
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-storms-pipeline.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # Fires at :00 AND :30 of every 3rd hour. The :30 run is a WSP
      # late-arrival retry (NHC often publishes the cycle's WSP zip after
      # the :00 run); it's fill-only — stages short-circuit on an
      # already-present issued_time or upsert identical rows.
      schedule:
        quartz_cron_expression: "0 0,30 0/3 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      parameters:
        - name: mode
          default: ${var.mode}
        - name: issued_time    # YYYY-MM-DDTHH; backfill override for a single advisory
          default: ""
        - name: since          # YYYY-MM-DD; inclusive lower bound on issued_time
          default: ""
        - name: until          # YYYY-MM-DD; exclusive upper bound on issued_time
          default: ""
        - name: overwrite      # "true" / ""
          default: ""
        - name: subcommand     # non-empty overrides the task's composite
          default: ""
        - name: sample_json    # frozen CurrentStorms JSON URL for smoke tests
          default: ""
        - name: admin_level    # "", "0", "1", or "0,1" — exposure subcmds only
          default: ""

      tasks:
        - task_key: etl
          spark_python_task:
            python_file: databricks/dispatch.py
            source: GIT
            parameters:
              - "nhc"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.since}}"
              - "{{job.parameters.until}}"
              - "{{job.parameters.overwrite}}"
              - "{{job.parameters.subcommand}}"
              - "{{job.parameters.sample_json}}"
              - "{{job.parameters.admin_level}}"
          libraries: &storm_libs
            - pypi: { package: "ocha-stratus" }
            - pypi: { package: "ocha-lens==0.6.1" }
            - pypi: { package: "python-dotenv" }
            - pypi: { package: "geopandas" }
            - pypi: { package: "rasterio" }
            - pypi: { package: "rioxarray" }
            - pypi: { package: "exactextract" }
            - pypi: { package: "antimeridian" }
            - pypi: { package: "coloredlogs" }
            - pypi: { package: "tqdm" }
            - pypi: { package: "geoalchemy2" }
            - pypi: { package: "databricks-sdk" }

        # Fire-and-forget kick of the Cuba Forecast Monitor, right after
        # ETL. Leaf task (nothing depends on it), parallel to
        # tracks_processing. trigger_job.py never raises, so a failure to
        # trigger — or in the monitor itself — cannot fail this run; the
        # monitor stays fully independent of the storms pipeline.
        - task_key: trigger_cuba_forecast
          depends_on:
            - task_key: etl
          spark_python_task:
            python_file: databricks/trigger_job.py
            source: GIT
            parameters:
              - "${var.cuba_forecast_job_id}"
              # Scheduled minute of this run (UTC, rounded down): the cron
              # fires at :00 and :30; the :30 run is only a WSP late-arrival
              # retry, so the monitor (needs tracks only, landed at :00) is
              # skipped on it. Anything other than "30" fires (fail-open, so
              # manual/ad-hoc runs still trigger). See issue #35.
              - "{{job.trigger.time.minute}}"
          libraries: *storm_libs

        - task_key: tracks_processing
          depends_on:
            - task_key: etl
          spark_python_task:
            python_file: databricks/dispatch.py
            source: GIT
            parameters:
              - "realtime-tracks-processing"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.since}}"
              - "{{job.parameters.until}}"
              - "{{job.parameters.overwrite}}"
              - "{{job.parameters.subcommand}}"
              - "{{job.parameters.sample_json}}"
              - "{{job.parameters.admin_level}}"
          libraries: *storm_libs

        - task_key: tracks_exposure
          depends_on:
            - task_key: tracks_processing
          spark_python_task:
            python_file: databricks/dispatch.py
            source: GIT
            parameters:
              - "realtime-tracks-exposure"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.since}}"
              - "{{job.parameters.until}}"
              - "{{job.parameters.overwrite}}"
              - "{{job.parameters.subcommand}}"
              - "{{job.parameters.sample_json}}"
              - "{{job.parameters.admin_level}}"
          libraries: *storm_libs

        - task_key: wsp_processing
          depends_on:
            - task_key: tracks_processing
          spark_python_task:
            python_file: databricks/dispatch.py
            source: GIT
            parameters:
              - "realtime-wsp-processing"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.since}}"
              - "{{job.parameters.until}}"
              - "{{job.parameters.overwrite}}"
              - "{{job.parameters.subcommand}}"
              - "{{job.parameters.sample_json}}"
              - "{{job.parameters.admin_level}}"
          libraries: *storm_libs

        - task_key: wsp_exposure
          depends_on:
            - task_key: wsp_processing
          spark_python_task:
            python_file: databricks/dispatch.py
            source: GIT
            parameters:
              - "realtime-wsp-exposure"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.since}}"
              - "{{job.parameters.until}}"
              - "{{job.parameters.overwrite}}"
              - "{{job.parameters.subcommand}}"
              - "{{job.parameters.sample_json}}"
              - "{{job.parameters.admin_level}}"
          libraries: *storm_libs

        # Fire-and-forget kick of the HTI Hurricane Monitoring job, once
        # everything it reads has landed (tracks + exposure + WSP). Same
        # isolation contract as trigger_cuba_forecast: trigger_job.py
        # never raises, so neither a trigger failure nor the monitor
        # itself can fail this run. Unlike the Cuba kick it fires on the
        # :30 WSP-retry run too (scheduled_minute passed as "") — the
        # monitor emails WSP figures, dedups by advisory, and picks up
        # advisories it deferred when data landed late.
        - task_key: trigger_hti_monitoring
          depends_on:
            - task_key: tracks_exposure
            - task_key: wsp_exposure
          spark_python_task:
            python_file: databricks/trigger_job.py
            source: GIT
            parameters:
              - "${var.hti_monitoring_job_id}"
              - ""
          libraries: *storm_libs

    # ===================================================================
    # GDACS/ADAM pipeline — 3 chained tasks (gdacs → adam → match).
    # Dispatches via databricks/dispatch_gdacs_adam.py. Compute is set
    # per target below (dev: dev_cluster_id; prod: ephemeral job cluster).
    # ===================================================================
    gdacs_adam_pipeline:
      name: GDACS/ADAM Pipeline
      # Job-scoped (NOT top-level) permission: this workspace tier has
      # directory ACLs disabled, so a bundle-wide permission fails on the
      # deployment folder. dsci members (incl. Tristan, not a workspace
      # admin) can see/run/manage it.
      permissions:
        - group_name: dsci
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-storms-pipeline.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # Every 3h (matches the NHC cadence). GDACS/ADAM current-mode is
      # idempotent (7d/14d lookback), so re-runs skip existing rows.
      schedule:
        quartz_cron_expression: "0 0 0/3 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      parameters:
        - name: mode
          default: ${var.mode}
        - name: from_date      # YYYY-MM-DD; archive lower bound
          default: ""
        - name: to_date        # YYYY-MM-DD; archive upper bound (defaults today)
          default: ""
        - name: days_back      # current-mode window; "" => pipeline default
          default: ""
        - name: source         # NOAA | JTWC
          default: "NOAA"
        - name: all_episodes   # "true" => fetch every episode, not just latest
          default: ""

      tasks:
        # Compute (existing_cluster_id vs job_cluster_key) is supplied per
        # target below: dev -> dev_cluster_id; prod -> ephemeral job cluster.
        - task_key: gdacs
          spark_python_task:
            python_file: databricks/dispatch_gdacs_adam.py
            source: GIT
            parameters:
              - "gdacs"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.from_date}}"
              - "{{job.parameters.to_date}}"
              - "{{job.parameters.days_back}}"
              - "{{job.parameters.source}}"
              - "{{job.parameters.all_episodes}}"
          libraries: &gdacs_libs
            - pypi: { package: "ocha-stratus" }
            # ocha-lens 0.5.0 is the first release carrying the GDACS/ADAM
            # APIs (get_exposure_adm0/adm1, match_to_atcf, …). Matches the
            # pin on main / requirements.txt. Bump when a newer release adds
            # what we need.
            - pypi: { package: "ocha-lens==0.6.1" }
            - pypi: { package: "python-dotenv" }
            - pypi: { package: "coloredlogs" }
            - pypi: { package: "tqdm" }
            - pypi: { package: "geoalchemy2" }
            - pypi: { package: "databricks-sdk" }

        - task_key: adam
          depends_on:
            - task_key: gdacs
          spark_python_task:
            python_file: databricks/dispatch_gdacs_adam.py
            source: GIT
            parameters:
              - "adam"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.from_date}}"
              - "{{job.parameters.to_date}}"
              - "{{job.parameters.days_back}}"
              - "{{job.parameters.source}}"
              - "{{job.parameters.all_episodes}}"
          libraries: *gdacs_libs

        - task_key: match
          depends_on:
            - task_key: adam
          spark_python_task:
            python_file: databricks/dispatch_gdacs_adam.py
            source: GIT
            # match only takes --mode; dispatch ignores the date/source
            # params for this subcommand. Positional slots still passed so
            # the argv contract is uniform across tasks.
            parameters:
              - "match"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.from_date}}"
              - "{{job.parameters.to_date}}"
              - "{{job.parameters.days_back}}"
              - "{{job.parameters.source}}"
              - "{{job.parameters.all_episodes}}"
          libraries: *gdacs_libs

    # ===================================================================
    # IBTrACS pipeline — 3 chained daily tasks: full best-track ETL
    # (run_pipeline.py ibtracs --dataset-type ALL) → wind buffers →
    # population exposure. Replaces the UI-created "Run IBTrACS" job
    # (638351145729392), which pinned ocha-lens==0.4.2 — too old for
    # calculate_wind_buffers_gdf — and failed on import every run with
    # no recorded success (and only covered the ETL; buffers/exposure
    # previously had no schedule at all). --mode is a job parameter:
    # dev by default, overridden to prod in the prod target (these ETLs
    # write the prod DB directly, unlike the NHC cutover which still
    # points prod at the dev DB).
    # ===================================================================
    ibtracs_pipeline:
      name: Run IBTrACS
      description: >-
        Retrieve best track cyclone data from
        [IBTrACS](https://www.ncei.noaa.gov/products/international-best-track-archive)
      # Same job-scoped permission rationale as nhc_pipeline: the old
      # workspace job was owner-locked (adm.itot6), which is exactly how
      # its stale pin became unfixable by the team.
      permissions:
        - group_name: dsci
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-storms-pipeline.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      schedule:
        quartz_cron_expression: "27 0 16 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tags:
        type: storms
        output_schema: storms.ibtracs_storms,storms.ibtracs_tracks_geo,storms.ibtracs_wind_buffers,storms.ibtracs_wind_exposure

      parameters:
        - name: mode
          default: ${var.mode}

      tasks:
        - task_key: download_ibtracs
          timeout_seconds: 10800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 7200
          spark_python_task:
            python_file: run_pipeline.py
            source: GIT
            parameters:
              - "ibtracs"
              - "--mode"
              - "{{job.parameters.mode}}"
              - "--dataset-type"
              - "ALL"
          libraries: &ibtracs_libs
            - pypi: { package: "ocha-stratus==0.1.7" }
            # 0.6.1 matches requirements.txt / the other jobs (bumped on
            # main by #45); 0.4.2 (the old workspace pin) predates
            # calculate_wind_buffers_gdf.
            - pypi: { package: "ocha-lens==0.6.1" }
            - pypi: { package: "python-dotenv" }
            - pypi: { package: "geopandas" }
            - pypi: { package: "netCDF4" }
            - pypi: { package: "cftime" }
            - pypi: { package: "xarray" }
            - pypi: { package: "pandera" }
            - pypi: { package: "coloredlogs" }
            - pypi: { package: "tqdm" }
            - pypi: { package: "geoalchemy2" }
            # Raster stack for the exposure task (WorldPop zonal stats);
            # shared by all tasks so the whole job uses one library env.
            - pypi: { package: "rasterio" }
            - pypi: { package: "rioxarray" }
            - pypi: { package: "exactextract" }

        # Wind buffer polygons from the freshly landed tracks. Fill-only
        # by default (skips already-computed (sid, wind_speed_kt) rows),
        # writing in batches as it goes — so if a large backfill outruns
        # the timeout, progress persists and the next daily run resumes
        # where it left off. NB run_wind_buffers always READS tracks from
        # the prod DB (hard-coded in src/pipelines/ibtracs.py) and writes
        # to --mode; coherent in prod, but a dev-target run computes
        # buffers from prod tracks.
        - task_key: wind_buffers
          depends_on:
            - task_key: download_ibtracs
          timeout_seconds: 10800
          spark_python_task:
            python_file: run_pipeline.py
            source: GIT
            parameters:
              - "wind-buffers"
              - "--mode"
              - "{{job.parameters.mode}}"
          libraries: *ibtracs_libs

        # Population exposure (WorldPop x adm1) from the wind buffers —
        # the table the cub-hurricanes trigger reads. Same fill-only /
        # resumable contract as wind_buffers.
        - task_key: exposure
          depends_on:
            - task_key: wind_buffers
          timeout_seconds: 10800
          spark_python_task:
            python_file: run_pipeline.py
            source: GIT
            parameters:
              - "ibtracs-track-exp"
              - "--mode"
              - "{{job.parameters.mode}}"
          libraries: *ibtracs_libs

    # ===================================================================
    # ECMWF pipeline — single daily task running the forecast-track ETL
    # (run_pipeline.py ecmwf). Replaces the UI-created "Run ECMWF
    # Storms" job (1053499360455948), broken the same way (its
    # ocha-lens==0.3.3 pin fails run_pipeline.py's import of the
    # ibtracs module). Same --mode parameter contract as
    # ibtracs_pipeline.
    # ===================================================================
    ecmwf_pipeline:
      name: Run ECMWF Storms
      description: Retrieve ECMWF tropical cyclone forecast tracks
      permissions:
        - group_name: dsci
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-storms-pipeline.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      schedule:
        quartz_cron_expression: "46 0 22 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tags:
        type: storms,forecast
        output_schema: storms.ecmwf_storms,storms.ecmwf_tracks_geo

      parameters:
        - name: mode
          default: ${var.mode}

      tasks:
        - task_key: download_ecmwf
          timeout_seconds: 1800
          spark_python_task:
            python_file: run_pipeline.py
            source: GIT
            parameters:
              - "ecmwf"
              - "--mode"
              - "{{job.parameters.mode}}"
          libraries: *ibtracs_libs

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
    variables:
      mode: dev
    # NHC dev runs on the personal interactive cluster; GDACS/ADAM dev runs
    # on the dedicated dev cluster (isolated lib env).
    resources:
      jobs:
        nhc_pipeline:
          tasks:
            - task_key: etl
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: trigger_cuba_forecast
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: tracks_processing
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: tracks_exposure
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: wsp_processing
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: wsp_exposure
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: trigger_hti_monitoring
              existing_cluster_id: ${var.existing_cluster_id}
        gdacs_adam_pipeline:
          tasks:
            - task_key: gdacs
              existing_cluster_id: ${var.dev_cluster_id}
            - task_key: adam
              existing_cluster_id: ${var.dev_cluster_id}
            - task_key: match
              existing_cluster_id: ${var.dev_cluster_id}
        ibtracs_pipeline:
          tasks:
            - task_key: download_ibtracs
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: wind_buffers
              existing_cluster_id: ${var.existing_cluster_id}
            - task_key: exposure
              existing_cluster_id: ${var.existing_cluster_id}
        ecmwf_pipeline:
          tasks:
            - task_key: download_ecmwf
              existing_cluster_id: ${var.existing_cluster_id}

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      # production mode requires an explicit root_path.
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    # Job runs as the deploying user (adm.tdowning), who holds Manage Run on
    # the Cuba monitor — so the post-ETL trigger fires. Set explicitly for
    # production mode and to pin the SINGLE_USER job cluster's identity.
    run_as:
      user_name: adm.tdowning@global.un.org
    variables:
      # TEMPORARY: the prod deployment reads/writes the DEV DB during cutover.
      # Flip to `prod` once we're ready to write prod tables. NB: this also
      # routes GDACS/ADAM prod at the DEV DB while set to dev.
      mode: dev
    # NHC prod runs on an ephemeral Job Compute cluster (policy bakes in the
    # dsci DB/blob secrets). GDACS/ADAM prod runs on its own ephemeral
    # single-node job cluster.
    resources:
      jobs:
        nhc_pipeline:
          job_clusters:
            - job_cluster_key: nhc_cluster
              new_cluster:
                # Job Compute policy (000C79D951EAF0D6): fixes cluster_type=job,
                # num_workers=1, STANDARD engine, and injects all dsci secret
                # env vars (DEV+PROD DB/blob), so no spark_env_vars block needed.
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                spark_version: "18.2.x-scala2.13"
                # DS4_v2 (28 GB), not DS3_v2 (14 GB): the WSP fcastonly
                # exposure adm1 pass OOM-killed the wsp_exposure task (exit
                # -9) three times on 2026-08-28 alone, leaving partially
                # written issuances that the all-levels short-circuit then
                # treats as done. ~15 min x 8 runs/day, so the cost delta is
                # negligible next to silent WSP exposure gaps.
                node_type_id: "Standard_DS4_v2"
                num_workers: 1
                data_security_mode: SINGLE_USER
          tasks:
            - task_key: etl
              job_cluster_key: nhc_cluster
            - task_key: trigger_cuba_forecast
              job_cluster_key: nhc_cluster
            - task_key: tracks_processing
              job_cluster_key: nhc_cluster
            - task_key: tracks_exposure
              job_cluster_key: nhc_cluster
            - task_key: wsp_processing
              job_cluster_key: nhc_cluster
            - task_key: wsp_exposure
              job_cluster_key: nhc_cluster
            - task_key: trigger_hti_monitoring
              job_cluster_key: nhc_cluster
        gdacs_adam_pipeline:
          job_clusters:
            - job_cluster_key: gdacs_adam_cluster
              new_cluster:
                # Job Compute policy (000C79D951EAF0D6): lets adm.tdowning
                # create the cluster without the global allow-cluster-create
                # entitlement (a raw new_cluster 403s with PERMISSION_DENIED),
                # and injects all dsci DB/blob secrets — so no spark_env_vars
                # block. Policy fixes cluster_type=job/num_workers=1 and
                # forbids the singleNode profile.
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                spark_version: "18.2.x-scala2.13"
                node_type_id: "Standard_DS3_v2"
                num_workers: 1
                data_security_mode: SINGLE_USER
          tasks:
            - task_key: gdacs
              job_cluster_key: gdacs_adam_cluster
            - task_key: adam
              job_cluster_key: gdacs_adam_cluster
            - task_key: match
              job_cluster_key: gdacs_adam_cluster
        # IBTrACS / ECMWF prod: ephemeral single-node Job Compute clusters
        # (same policy pattern as above), and — unlike the NHC cutover —
        # mode=prod: these ETLs own the prod storms.ibtracs_* / ecmwf_*
        # tables, matching the workspace jobs they replace.
        ibtracs_pipeline:
          parameters:
            - name: mode
              default: prod
          job_clusters:
            - job_cluster_key: ibtracs_cluster
              new_cluster:
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                spark_version: "18.2.x-scala2.13"
                # DS4_v2 (28 GB) like nhc_cluster, not DS3_v2: the exposure
                # task holds WorldPop + FieldMaps adm1 + buffers in memory,
                # the same workload shape that OOM-killed the NHC WSP
                # exposure on DS3 (see nhc_cluster note).
                node_type_id: "Standard_DS4_v2"
                num_workers: 1
                data_security_mode: SINGLE_USER
          tasks:
            - task_key: download_ibtracs
              job_cluster_key: ibtracs_cluster
            - task_key: wind_buffers
              job_cluster_key: ibtracs_cluster
            - task_key: exposure
              job_cluster_key: ibtracs_cluster
        ecmwf_pipeline:
          parameters:
            - name: mode
              default: prod
          job_clusters:
            - job_cluster_key: ecmwf_cluster
              new_cluster:
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                spark_version: "18.2.x-scala2.13"
                node_type_id: "Standard_DS3_v2"
                num_workers: 1
                data_security_mode: SINGLE_USER
          tasks:
            - task_key: download_ecmwf
              job_cluster_key: ecmwf_cluster
