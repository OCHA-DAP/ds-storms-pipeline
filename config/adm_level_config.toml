# Per-ISO3 admin-level overrides for FieldMaps ↔ GADM crosswalk.
#
# Default behavior is FM adm1 ↔ GADM adm1. Use this file only when that
# default produces a bad crosswalk because FieldMaps and GADM disagree
# on what "admin 1" means for a particular country.
#
# Each [overrides.<ISO3>] block sets `fm_level` and `gadm_level` for
# that country. The `note` field documents WHY this override exists —
# add one when you change anything here so future readers can audit.

[defaults]
fm_level = 1
gadm_level = 1

# ── FieldMaps data gaps ──────────────────────────────────────────────
# FieldMaps stores these territories as a single polygon at every level
# (adm1 and adm2 both have count = 1), so there's no finer FM unit to
# crosswalk. GADM has subdivisions (18 districts for AIA, 12 parishes
# for JEY, 2 for BLM) but they're unreachable from the FM side.
#
# We match FM adm1 ↔ GADM adm0 here, which gives us a clean 1:1
# whole-territory crosswalk. The trade-off: sub-territory impact
# reporting is unavailable for these countries until FieldMaps adds the
# subdivisions upstream.

[overrides.AIA]
fm_level = 1
gadm_level = 0
note = "FM has 1 polygon for the whole island; GADM has 18 districts. No finer FM unit exists — collapse to whole-country crosswalk."

[overrides.BLM]
fm_level = 1
gadm_level = 0
note = "FM has 1 polygon for the whole territory; GADM has 2 sub-areas. No finer FM unit exists — collapse to whole-country crosswalk."

[overrides.JEY]
fm_level = 1
gadm_level = 0
note = "FM has 1 polygon for the whole island; GADM has 12 parishes. No finer FM unit exists — collapse to whole-country crosswalk."

# ── Admin-level skew ─────────────────────────────────────────────────
# FieldMaps stores Puerto Rico's 78 municipios at admin LEVEL 2 (with
# adm1 = the whole territory). GADM stores the same 78 municipios at
# admin LEVEL 1. So FM adm2 ↔ GADM adm1 lines up cleanly (77/78 match).
#
# Without this override the default (1,1) pairs FM's island-wide polygon
# against random GADM municipios, scoring IoU ~ 0.04 across the board.

[overrides.PRI]
fm_level = 2
gadm_level = 1
note = "FM puts 78 municipios at adm2; GADM puts them at adm1. Swap levels so the units line up. **FieldMaps data-quality issue worth raising upstream**: most authoritative sources (GADM, ISO 3166-2, GDACS, US Census MAF/TIGER) treat municipios as admin-1. FM's adm1 for PRI is a single whole-territory polygon — there is no real adm1 subdivision in FM's data."

# ─────────────────────────────────────────────────────────────────────
# GDACS bridge overrides
# ─────────────────────────────────────────────────────────────────────
# These apply ONLY to the FieldMaps ↔ GDACS crosswalk (the
# `match_gdacs_fieldmaps.py` script). The GADM script ignores them.
#
# The GDACS admin layer (`W_ADM_ADMIN2010_V2021`) was built from 2010
# boundaries and treats many small countries as a single polygon at
# admin-1. For those countries the only sensible FM crosswalk is at
# adm0 (whole-country) — see entries below.
#
# Resolution order in the script:
#   1. `[gdacs_overrides.<ISO3>]` (bridge-specific)
#   2. `[overrides.<ISO3>]` (shared/GADM defaults)
#   3. `[defaults]`

# ─────────────────────────────────────────────────────────────────────
# Known FieldMaps data-quality issues
# ─────────────────────────────────────────────────────────────────────
# Not consumed by any script — for human reference and tracking what
# should be raised upstream with FieldMaps.

[data_quality.PRI]
issue = "PRI adm1 in FieldMaps is a single whole-territory polygon. The 78 municipios — the actual conventional admin-1 subdivision recognized by ISO 3166-2, GADM, US Census MAF/TIGER — are stored at FM adm2 instead. GDACS in turn uses 8 Senatorial Districts (neither layer matches)."
implication = "Forces every consumer to special-case PRI with an admin-level offset. Affects FM↔GADM and FM↔GDACS crosswalks here."
action = "Workaround in place: gdacs_policy.PRI uses aggregate_gdacs_to_fm, mapping all 8 GDACS senatorial districts into the single FM adm1 polygon via reverse spatial join. Still worth raising upstream with FieldMaps maintainers — request they promote the 78 municipios to adm1 to align with other authoritative sources."

[gdacs_overrides.PRI]
fm_level = 1
note = "Override the [overrides.PRI] fm_level=2 (which is for the GADM bridge). For GDACS bridge use FM adm1 (1 polygon = whole island) so the country_only policy collapses 8 senatorial districts to a single PR unit."

# DOM gdacs_overrides removed 2026-05-20: we previously set fm_level=2
# for DOM (32 FM provinces ↔ 31 GDACS provinces, clean 1:1). Reverted to
# fm_level=1 (default) for consistency with BEL and FRA, which face the
# same "GDACS finer than FM adm1" pattern. All three are now handled via
# the `aggregate_gdacs_to_fm` policy → reverse spatial join + sum at
# runtime. Trade-off: lose municipio-level resolution in DOM-side reports
# in exchange for uniform "1 row per FM adm1 unit affected" framing across
# the basin.

# ─────────────────────────────────────────────────────────────────────
# Runtime per-country policy for the FieldMaps ↔ GDACS bridge
# ─────────────────────────────────────────────────────────────────────
# The pipeline enrichment step reads these to decide what to do with
# each `storms.gdacs_exposure` admin1 row. Action vocabulary:
#
#   accept                 — trust the crosswalk best-match. Apply
#                            gmi_admin → fm_pcode directly.
#   country_only           — admin1 not separable. Map all admin1 rows
#                            for this country to the FM adm0 pcode.
#                            Used for: gdacs_empty + 1↔1 single-poly.
#   aggregate_gdacs_to_fm  — GDACS is finer than FM. Run a one-shot
#                            spatial join (gmi_admin centroid →
#                            containing FM polygon) to build a
#                            many-to-one gmi_admin → fm_pcode lookup,
#                            then aggregate exposure on the fm_pcode.
#   report_at_gdacs_level  — FM finer than GDACS. Can't subdivide;
#                            report this country's exposure at the
#                            GDACS granularity (using gmi_admin as
#                            the unit identifier downstream).
#   needs_manual_mapping   — real boundary disagreement or unresolved
#                            FM-side issue. Flag to user; per-row
#                            override CSV may be needed.

[gdacs_policy.ABW]
action = "country_only"
note = "single-polygon territory, 1:1 with GDACS"

[gdacs_policy.AIA]
action = "country_only"
note = "FM has 1 polygon for AIA; GDACS also 1 (whole island)"

[gdacs_policy.ATG]
action = "fm_adm1_only"
note = "GDACS treats ATG as a single whole-country polygon; FM has 1 parishes at adm1. Emit FM adm1 rows in the lookup so per-unit numbers from other sources (NHC, ADAM) can attach via fm_pcode; GDACS adm1 deliberately doesn't attach (gmi_admin=NULL) to avoid replicating the whole-country number across each parishe."

[gdacs_policy.BEL]
action = "aggregate_gdacs_to_fm"
note = "3 FM regions vs 11 GDACS provinces. Sum GDACS provinces up to FM regions via reverse spatial join (gmi_admin → containing fm_pcode)."

[gdacs_policy.BES]
action = "country_only"
note = "not in GDACS 2010 layer (post-2010 territory split)"

