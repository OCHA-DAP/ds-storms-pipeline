note = "GDACS uses pre-2011 boundary. The 'CUB-LHB / La Habana' GDACS polygon covers BOTH modern Mayabeque AND Artemisa (the province was split in 2011). The same GDACS exposure number will appear under both Mayabeque and Artemisa rows — DO NOT SUM across them, that double-counts the population."


