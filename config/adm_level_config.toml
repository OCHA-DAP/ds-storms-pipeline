[gdacs_policy.SJM]
action = "fm_adm1_only"
note = "Svalbard + Jan Mayen — 2 GDACS polys = 2 FM polys. FM has a data-quality issue: adm1_name is NULL (subdivision names sit in adm0_name instead). Using fm_adm1_only until FM data improves; GDACS adm1 lands as by-design unmatched."

[gdacs_policy.SLV]
action = "accept"
note = "14 GDACS departments = 14 FM departments, names align cleanly. Pacific coast — leaks into Atlantic-basin scope via cross-basin event reporting."

[gdacs_policy.SPM]
action = "country_only"
note = "St. Pierre & Miquelon — NW Atlantic. 1 GDACS poly = 1 FM poly. country_only fits."

[gdacs_policy.SWE]
action = "accept"
note = "24 GDACS län ↔ 21 FM län. GDACS uses pre-1997/1998 boundaries; FM uses post-merger län. Most match cleanly; two FM units (Skåne län, Västra Götalands län) are the post-merger consolidations of older GDACS län — see per_row_notes."

[gdacs_policy.UMI]
action = "accept"
note = "6 GDACS islands (Jarvis, Baker, Howland, Johnston Atoll, Midway, Wake) match 6 of FM's 9 (FM also has Kingman Reef, Palmyra Atoll, Navassa Island which GDACS doesn't list). FM has the same null-adm1_name data quirk as SJM — fallback to adm0_name handled in the build script."
# ─────────────────────────────────────────────────────────────────────
# no_fm_source: GDACS reports these iso3s but FieldMaps has no
# adm0 parquet for them. Deliberately excluded from the lookup
# and from the alert pipeline.
# ─────────────────────────────────────────────────────────────────────

[gdacs_policy.ANT]
action = "no_fm_source"
note = "Netherlands Antilles — dissolved 2010-10-10. FieldMaps has no ANT parquet (the entity no longer exists; successor states CUW, SXM, BES are independently tracked). GDACS still surfaces ANT for historical events. We deliberately don't attach any exposure for this iso3."

[gdacs_policy.XIM]
action = "no_fm_source"
note = "Isle of Man — no FieldMaps source available. GDACS reports it via extratropical-transition events. Deliberately not attached."
