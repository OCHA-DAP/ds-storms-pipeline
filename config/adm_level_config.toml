# ──────────────────────────────────────────────────────────────────────
# FM ↔ ADAM bridge policy
# ──────────────────────────────────────────────────────────────────────
# Mirror of [gdacs_policy.<ISO3>] but for the FM↔ADAM lookup. ADAM
# (WFP) emits exposure rows by admin name; the intermediate boundary
# layer is the ADAM source boundary file (the ADAM source layer's filename) (WFP's published global adm1 layer, same
# vendor). Policy choices reflect the ADAM ↔ FM relationship, NOT
# the ADAM ↔ FM relationship — because ADAM's CSVs use ADAM admin layer names
# verbatim. Same six actions as gdacs_policy:
#   accept, country_only, aggregate_adam_to_fm, fm_adm1_only,
#   needs_manual_mapping, no_adam_source
# This is a first-pass seed — most ISO3s default to country_only
# (no entry) until reviewed.

# Clean 1:1 ADAM ↔ FM at adm1 (matcher IoU ≥ 0.99 in smoke run)
[adam_policy.HTI]
action = "accept"

[adam_policy.MEX]
action = "accept"

[adam_policy.BMU]
action = "accept"
note = "the ADAM admin layer and FM both have the 9 parishes; clean match. NOTE: ADAM's published CSV often emits placeholder values ('---', 'Under National Administration') for BMU adm1 — that's an ADAM-side data quality issue, not a lookup gap. Downstream rows that don't match adam_admin_name simply won't attach (left-join semantics)."

# ADAM admin layer finer than FM — reverse spatial join rolls ge polygons up
# to the containing FM polygon. Each FM region gets multiple
# (the ADAM admin layer_id, adam_admin_name) lookup rows.
[adam_policy.ISL]
action = "aggregate_adam_to_fm"
note = "FM has 8 regions; the ADAM admin layer has 75 municipalities (sveitarfélög). ADAM emits the municipality names. Aggregation maps each municipality to its containing FM region."

[adam_policy.DOM]
action = "aggregate_adam_to_fm"
note = "FM has 10 regions; the ADAM admin layer has 33 provinces. ADAM emits province names. Aggregation maps each province to its containing FM region."

# Same pre-2011 Cuba reform that affects the GDACS lookup — ADAM
# inherits the issue because the ADAM admin layer still carries the old La Habana
# boundary that became Artemisa + Mayabeque.
[adam_policy.CUB]
action = "needs_manual_mapping"
note = "Same Artemisa/Mayabeque pre-split caveat as gdacs_policy.CUB. the ADAM admin layer has 16 provinces (matching FM count) but a couple of names lag the modern boundary — see [[adam_per_row_notes]]."

# ADAM has no usable source for these — same exclusion list as
# gdacs_policy. ANT dissolved 2010; XIM has no FM parquet either.
[adam_policy.ANT]
action = "no_adam_source"
note = "Netherlands Antilles dissolved 2010-10-10."

[adam_policy.XIM]
action = "no_adam_source"
note = "No FM parquet for XIM."


# ── accept: clean 1:1 ADAM ↔ FM ────────────────────────────────────
# Auto-classified by build_adam_review_artifacts.py. Mean IoU ≥ 0.6 and
# fm_count ≈ ge_count (within 2×). Mild noise (low_iou, multiple_
# candidates) is fine; the matcher picks best-IoU which is the right
# behaviour. Anything ADAM emits that doesn't match an adam_admin_name
# in the lookup simply fails to attach (left-join) — that includes the
# upstream iso3-misattribution bug surfacing on UMI / SPM / FRO etc.,
# which we ignore at this layer because the bad data won't match.

[adam_policy.BES]
action = "accept"

[adam_policy.BLM]
action = "accept"

[adam_policy.CAN]
action = "accept"

[adam_policy.FRO]
action = "accept"

[adam_policy.MAF]
action = "accept"

[adam_policy.MSR]
action = "country_only"
note = "ADAM emits settlement-level names for MSR (Brodericks, Central, East, Plymouth, Salem, …) — Plymouth is the volcano-destroyed former capital, so these are real MSR settlements. WFP appears to use a finer admin level for MSR than its standard adm1 publication: our reference adm1 layer has 3 parishes (Saint Anthony, Saint Georges, Saint Peter) that don't correspond. No usable per-name crosswalk to FM's 3 parishes — country_only attaches ADAM exposure at adm0 only until a finer FM-side breakdown becomes available."

[adam_policy.SPM]
action = "accept"

[adam_policy.ESP]
action = "accept"
note = "89% clean. 2 of 19 FM units flagged multiple_candidates — minor coastal-boundary overlap; best-IoU pick is right."

[adam_policy.UMI]
action = "accept"
note = "9 FM atolls vs 9 ge entries match cleanly. NOTE: ADAM's UMI rows in storms.adam_exposure include rows whose admin_name is actually a Jamaican parish (Westmoreland, Trelawny, ...) — that's a misattribution bug in ocha_lens.datasources.adam.name_to_iso3's pycountry fuzzy fallback. Those won't match the lookup so they fail to attach — safe behaviour, but the upstream fix should land in ocha-lens."

[adam_policy.ATG]
action = "accept"
note = "88% clean. 7/8 FM parishes match; Saint John / Saint John's normalises fine downstream."

[adam_policy.JAM]
action = "accept"
note = "88% clean. 14 FM parishes match cleanly; 2 of FM's 16 are offshore cays (Pedro Cays etc.) that the ADAM admin layer doesn't carry → no_overlap. Acceptable loss."

[adam_policy.USA]
action = "accept"
note = "88% clean. 45/51 FM states clean; 6 multiple_candidates are coastal states where the ADAM admin layer has both the state polygon and a small offshore admin (DC, similar)."

[adam_policy.NLD]
action = "accept"
note = "10/12 provinces clean; 2 multiple_candidates."

[adam_policy.VGB]
action = "accept"
note = "FM has 7 islands, ge has 5 — accept picks best IoU per FM, the 2 FM units with no ge counterpart (small cays) lose adm1 attribution."

[adam_policy.DMA]
action = "accept"
note = "70% clean. 10/10 FM and ge match by count; 3 multi-candidate parishes overlap each other slightly but best-IoU is unambiguous."

[adam_policy.TCA]
action = "accept"
note = "4/6 clean. Salt Cay (FM) vs Salt City (ge typo) is one of the misses."

[adam_policy.BHS]
action = "accept"
note = "FM 32 districts vs ge 22 — accept emits 22 lookup rows. Berry Islands, Black Point, Mangrove Cay etc. (10 FM units) have no ge counterpart and won't surface ADAM exposure at adm1; that's accurate to the source — ADAM doesn't emit names for those districts either."


# ── aggregate_adam_to_fm: ADAM admin layer finer than FM ──────────────────────
# Reverse spatial join: each ge polygon → its containing FM polygon.
# Triggered when ge_count >= 2 * fm_count, or when FM has 1 polygon
# and ge has many.

[adam_policy.AIA]
action = "aggregate_adam_to_fm"
note = "FM treats AIA as 1 polygon; the ADAM admin layer has 10 villages. All 10 villages aggregate to the single FM AIA polygon."

[adam_policy.IRL]
action = "aggregate_adam_to_fm"
note = "FM has 4 regions; the ADAM admin layer has 27 counties. Each county rolls up to its containing FM region."

[adam_policy.PRT]
action = "aggregate_adam_to_fm"
note = "FM has 20 regions; the ADAM admin layer has 29 finer subdivisions. Auto-classifier picked needs_manual_mapping based on multi_candidate count, but the shape is the same aggregate pattern as ISL/DOM/IRL — ge is just finer."


# ── fm_adm1_only: ADAM admin layer too coarse to disambiguate FM ──────────────
# FM has real adm1 units but the ADAM admin layer has 1 polygon (or few) for the
# country. Surfaces FM rows with the ADAM admin layer_id=NULL so other sources can
# still attach via fm_pcode; ADAM adm1 deliberately doesn't attach.

[adam_policy.GLP]
action = "fm_adm1_only"
note = "FM has 2 polygons (mainland Guadeloupe + offshore); the ADAM admin layer has 1. ADAM rows for GLP are also affected by the upstream iso3-misattribution bug (admin_names that belong to other countries), so the disable-adm1-attach behaviour of fm_adm1_only is the right outcome either way."

[adam_policy.VIR]
action = "fm_adm1_only"
note = "FM has 3 islands (St Thomas, St John, St Croix); the ADAM admin layer has 1 polygon for the territory. ge can't disambiguate the 3 FM units, so surface them with the ADAM admin layer_id=NULL."

[adam_policy.CYM]
action = "fm_adm1_only"
note = "FM has 6 districts; the ADAM admin layer has 3. 0% clean — every match is partial IoU. Safer to surface FM rows with NULL than guess via best-IoU."

[adam_policy.GRL]
action = "fm_adm1_only"
note = "FM has 6 municipalities (post-2009 reform); the ADAM admin layer has 3 (pre-2009). Same boundary-reform mismatch as gdacs_policy.GRL — needs_manual_mapping there, fm_adm1_only here because the ADAM admin layer's 3 polygons aren't the right level."


# ── country_only: don't attach adm1 even though FM has units ─────────

[adam_policy.PRI]
action = "country_only"
note = "Special: gdacs_overrides.PRI sets fm_level=2 (78 municipios) for the GDACS bridge. ADAM only emits 1 row for PRI (admin_level=0 effectively), so adm1 attachment makes no sense. country_only keeps the adm0 row and skips adm1."


# ── needs_manual_mapping: real boundary disagreement at same level ───
# Same count on both sides but heavy multi_candidate overlap signals
# admins that have been reorganised between the two source releases.

[adam_policy.KNA]
action = "needs_manual_mapping"
note = "14 FM parishes vs 14 ge parishes; only 2 clean, 9 multi_candidate, 3 low_iou. Parish boundaries appear to have shifted between source releases. Per-row notes need authoring; for now best-IoU pick attaches but is unreliable."

[adam_policy.MTQ]
action = "needs_manual_mapping"
note = "4 FM communes vs 4 ge — half are multi_candidate. Likely the same canton/commune restructuring as some of the other French overseas territories. Best-IoU pick attaches but flagged."


# ──────────────────────────────────────────────────────────────────────
# FM ↔ ADAM per-row overrides
# ──────────────────────────────────────────────────────────────────────
# Override the matcher's per-ADAM-admin spatial pick. Four actions:
#
#   action = "drop"            — source-keyed; emit no row at all for
#                                this adam_admin_id (TOML is the audit).
#   action = "remap"           — source-keyed; change the FM target to
#                                fm_pcode_override / fm_name_override.
#   action = "mark_no_source"  — fm-keyed; force a NULL-source row for
#                                this FM unit with the given caveat.
#   action = "caveat"          — keyed either side; annotate without
#                                changing the mapping.
#
# caveat_kind controlled vocabulary (informs alert footnote template):
#   no_adam_at_adm1        FM unit has no source coverage
#   source_coarser_than_fm Source polygon covers multiple FM units
#   pre_split_boundary     Source predates an FM admin-reform
#   manual_remap           IoU pick was overridden manually
#   fm_only_policy         Country policy is fm_adm1_only

# ─── BHS — three remaps, one caveat ────────────────────────────────────
# IoU picked the geographically-larger neighboring FM unit in three
# cases because ge polygons are coarser than FM in some parts of the
# island chain. Name correspondence is unambiguous; remap.

[[adam_row_overrides]]
iso3 = "BHS"
adam_admin_id = 901501
action = "remap"
fm_pcode_override = "BHS-20201113-06"
fm_name_override = "Central Abaco"
caveat_kind = "manual_remap"
note = "IoU picked FM Hope Town (0.16); ge name 'Central Abaco' corresponds to FM Central Abaco."

[[adam_row_overrides]]
iso3 = "BHS"
adam_admin_id = 901502
action = "remap"
fm_pcode_override = "BHS-20201113-07"
fm_name_override = "Central Andros"
caveat_kind = "manual_remap"
note = "IoU picked FM North Andros (0.47); ge name 'Central Andros' corresponds to FM Central Andros."

[[adam_row_overrides]]
iso3 = "BHS"
adam_admin_id = 901507
action = "remap"
fm_pcode_override = "BHS-20201113-09"
fm_name_override = "City of Freeport"
caveat_kind = "manual_remap"
note = "IoU picked FM West Grand Bahama (0.64); ge name 'Freeport' corresponds to FM City of Freeport."

[[adam_row_overrides]]
iso3 = "BHS"
adam_admin_id = 901518
action = "caveat"
caveat_kind = "source_coarser_than_fm"
note = "ge polygon labeled 'Under National Administration' (GAUL placeholder) maps spatially to FM New Providence (Nassau). The IoU pick is correct (0.51); flagging because the source name is opaque — alerts using ADAM's emitted name 'Under National Administration' for a BHS row should know it routes to New Providence."

# ─── USA — drop the federal-lands placeholder ─────────────────────────
[[adam_row_overrides]]
iso3 = "USA"
adam_admin_id = 902134
action = "drop"
note = "ge 'Under National Administration' is a GAUL placeholder for federal/unincorporated lands. IoU picked FM Michigan (0.32) by spatial drift; no state-level FM correspondence. Drop."

# ─── VGB — drop the catch-all placeholder ──────────────────────────────
[[adam_row_overrides]]
iso3 = "VGB"
adam_admin_id = 39505
action = "drop"
note = "ge 'Other Islands' is a catch-all polygon mapping to FM 'uncertain' (FM's own placeholder). Both are non-real admin units. Drop."


# ──────────────────────────────────────────────────────────────────────
# GDACS — shared source polygons (boundary-reform cases)
# ──────────────────────────────────────────────────────────────────────
# When GDACS's admin polygon predates a modern FM-side admin reform,
# one GDACS code maps to multiple modern FM units. Reporting the same
# exposure number under both FM rows is correct (GDACS doesn't
# disaggregate); the caveat note tells downstream consumers and alert
# text to NOT sum across the listed FM rows.
#
# Schema:
#   iso3, gmi_admin, fm_pcodes:[], caveat_kind, note
# Build script applies the same caveat_kind + caveat_note to every
# lookup row whose fm_pcode is in fm_pcodes for the given iso3.

[[gdacs_shared_source]]
iso3 = "CUB"
gmi_admin = "CUB-LHB"
fm_pcodes = ["CUB-20201118-01", "CUB-20201118-12"]
caveat_kind = "pre_split_boundary"
note = "GDACS uses the pre-2011 boundary 'La Habana' (CUB-LHB). The Cuban province was split in 2011 into modern Artemisa and Mayabeque. The same GDACS exposure number is reported under both FM rows — do not sum across them."

[[gdacs_shared_source]]
iso3 = "GRL"
gmi_admin = "GRL-VST"
fm_pcodes = ["GRL-20230119-1", "GRL-20230119-2", "GRL-20230119-4", "GRL-20230119-5"]
caveat_kind = "pre_split_boundary"
note = "GDACS uses the pre-2009 boundary 'Vestgrønland' (West Greenland). Greenland reformed its admin structure in 2009 (and again in 2018) into modern municipalities. GDACS-VST covers what is now Avannaata + Kujalleq + Qeqertalik + Qeqqata. Same GDACS exposure number under all four FM rows — do not sum."

[[gdacs_shared_source]]
iso3 = "GRL"
gmi_admin = "GRL-OST"
fm_pcodes = ["GRL-20230119-3", "GRL-20230119-6"]
caveat_kind = "pre_split_boundary"
note = "GDACS uses the pre-2009 boundary 'Østgrønland' (East Greenland). Covers what is now Northeast Greenland National Park + Sermersooq. Same GDACS exposure under both FM rows — do not sum."

[[gdacs_shared_source]]
iso3 = "ISL"
gmi_admin = "ISL-RYK"
fm_pcodes = ["ISL-20230119-1", "ISL-20230119-5"]
caveat_kind = "pre_split_boundary"
note = "GDACS 'Reykjavik' polygon spans what is now FM Capital Region (Höfuðborgarsvæðið) and FM Southern Peninsula (Suðurnes) under Iceland's modern regional split. Same GDACS exposure number under both FM rows."

[[gdacs_shared_source]]
