# ─────────────────────────────────────────────────────────────────────
# Known FieldMaps data-quality issues
# ─────────────────────────────────────────────────────────────────────
# Not consumed by any script — for human reference and tracking what
# should be raised upstream with FieldMaps.

[data_quality.PRI]
issue = "PRI adm1 in FieldMaps is a single whole-territory polygon. The 78 municipios — the actual conventional admin-1 subdivision recognized by ISO 3166-2, GADM, US Census MAF/TIGER — are stored at FM adm2 instead. GDACS in turn uses 8 Senatorial Districts (neither layer matches)."
implication = "Forces every consumer to special-case PRI with an admin-level offset. Affects FM↔GADM and FM↔GDACS crosswalks here."
action = "Workaround in place: gdacs_policy.PRI uses aggregate_gdacs_to_fm, mapping all 8 GDACS senatorial districts into the single FM adm1 polygon via reverse spatial join. Still worth raising upstream with FieldMaps maintainers — request they promote the 78 municipios to adm1 to align with other authoritative sources."

[gdacs_overrides.CYM]
fm_level = 0
note = "GDACS layer has 1 polygon for CYM; FM has 6 districts. Collapse FM to country level."

[gdacs_overrides.GLP]
fm_level = 0
note = "GDACS layer has 1 polygon for GLP; FM has 2 arrondissements. Collapse FM to country level."

[gdacs_overrides.MSR]
fm_level = 0
note = "GDACS layer has 1 polygon for MSR; FM has 3 parishes. Collapse FM to country level."

[gdacs_overrides.MTQ]
fm_level = 0
note = "GDACS layer has 1 polygon for MTQ; FM has 4 arrondissements. Collapse FM to country level."

[gdacs_overrides.TCA]
fm_level = 0
note = "GDACS layer has 1 polygon for TCA; FM has 6 districts. Collapse FM to country level."

[gdacs_overrides.VGB]
fm_level = 0
note = "GDACS layer has 1 polygon for VGB; FM has 7 admin units. Collapse FM to country level."

[gdacs_overrides.VIR]
fm_level = 0
note = "GDACS layer has 1 polygon for VIR; FM has 3 districts. Collapse FM to country level."

[gdacs_overrides.PRI]
fm_level = 1
note = "Override the [overrides.PRI] fm_level=2 (which is for the GADM bridge). For GDACS bridge use FM adm1 (1 polygon = whole island) so the country_only policy collapses 8 senatorial districts to a single PR unit."

# DOM gdacs_overrides removed 2026-05-20: we previously set fm_level=2
# for DOM (32 FM provinces ↔ 31 GDACS provinces, clean 1:1). Reverted to
# fm_level=1 (default) for consistency with BEL and FRA, which face the
# same "GDACS finer than FM adm1" pattern. All three are now handled via
# the `aggregate_gdacs_to_fm` policy → reverse spatial join + sum at
# runtime. Trade-off: lose municipio-level resolution in DOM-side reports
# in exchange for uniform "1 row per FM adm1 unit affected" framing across
# the basin.

# ─────────────────────────────────────────────────────────────────────
# Runtime per-country policy for the FieldMaps ↔ GDACS bridge
# ─────────────────────────────────────────────────────────────────────
# The pipeline enrichment step reads these to decide what to do with
# each `storms.gdacs_exposure` admin1 row. Action vocabulary:
#
#   accept                 — trust the crosswalk best-match. Apply
#                            gmi_admin → fm_pcode directly.
#   country_only           — admin1 not separable. Map all admin1 rows
#                            for this country to the FM adm0 pcode.
#                            Used for: gdacs_empty + 1↔1 single-poly.
#   aggregate_gdacs_to_fm  — GDACS is finer than FM. Run a one-shot
#                            spatial join (gmi_admin centroid →
#                            containing FM polygon) to build a
#                            many-to-one gmi_admin → fm_pcode lookup,
#                            then aggregate exposure on the fm_pcode.
#   report_at_gdacs_level  — FM finer than GDACS. Can't subdivide;
#                            report this country's exposure at the
#                            GDACS granularity (using gmi_admin as
#                            the unit identifier downstream).
#   needs_manual_mapping   — real boundary disagreement or unresolved
#                            FM-side issue. Flag to user; per-row
#                            override CSV may be needed.

[gdacs_policy.ABW]
action = "country_only"
note = "single-polygon territory, 1:1 with GDACS"

[gdacs_policy.AIA]
action = "country_only"
note = "FM has 1 polygon for AIA; GDACS also 1 (whole island)"

[gdacs_policy.ATG]
action = "country_only"
note = "fm_level=0 override; 1:1 country match"

[gdacs_policy.BEL]
action = "aggregate_gdacs_to_fm"
note = "3 FM regions vs 11 GDACS provinces. Sum GDACS provinces up to FM regions via reverse spatial join (gmi_admin → containing fm_pcode)."

[gdacs_policy.BES]
action = "country_only"
note = "not in GDACS 2010 layer (post-2010 territory split)"

[gdacs_policy.BHS]
