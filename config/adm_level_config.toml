# Per-ISO3 admin-level overrides for FieldMaps ↔ GADM crosswalk.
#
# Default behavior is FM adm1 ↔ GADM adm1. Use this file only when that
# default produces a bad crosswalk because FieldMaps and GADM disagree
# on what "admin 1" means for a particular country.
#
# Each [overrides.<ISO3>] block sets `fm_level` and `gadm_level` for
# that country. The `note` field documents WHY this override exists —
# add one when you change anything here so future readers can audit.

[defaults]
fm_level = 1
gadm_level = 1

# ── FieldMaps data gaps ──────────────────────────────────────────────
# FieldMaps stores these territories as a single polygon at every level
# (adm1 and adm2 both have count = 1), so there's no finer FM unit to
# crosswalk. GADM has subdivisions (18 districts for AIA, 12 parishes
# for JEY, 2 for BLM) but they're unreachable from the FM side.
#
# We match FM adm1 ↔ GADM adm0 here, which gives us a clean 1:1
# whole-territory crosswalk. The trade-off: sub-territory impact
# reporting is unavailable for these countries until FieldMaps adds the
# subdivisions upstream.

[overrides.AIA]
fm_level = 1
gadm_level = 0
note = "FM has 1 polygon for the whole island; GADM has 18 districts. No finer FM unit exists — collapse to whole-country crosswalk."

[overrides.BLM]
fm_level = 1
gadm_level = 0
note = "FM has 1 polygon for the whole territory; GADM has 2 sub-areas. No finer FM unit exists — collapse to whole-country crosswalk."

[overrides.JEY]
fm_level = 1
gadm_level = 0
note = "FM has 1 polygon for the whole island; GADM has 12 parishes. No finer FM unit exists — collapse to whole-country crosswalk."

# ── Admin-level skew ─────────────────────────────────────────────────
# FieldMaps stores Puerto Rico's 78 municipios at admin LEVEL 2 (with
# adm1 = the whole territory). GADM stores the same 78 municipios at
# admin LEVEL 1. So FM adm2 ↔ GADM adm1 lines up cleanly (77/78 match).
#
# Without this override the default (1,1) pairs FM's island-wide polygon
# against random GADM municipios, scoring IoU ~ 0.04 across the board.

[overrides.PRI]
fm_level = 2
gadm_level = 1
note = "FM puts 78 municipios at adm2; GADM puts them at adm1. Swap levels so the units line up. **FieldMaps data-quality issue worth raising upstream**: most authoritative sources (GADM, ISO 3166-2, GDACS, US Census MAF/TIGER) treat municipios as admin-1. FM's adm1 for PRI is a single whole-territory polygon — there is no real adm1 subdivision in FM's data."

# ─────────────────────────────────────────────────────────────────────
# GDACS bridge overrides
# ─────────────────────────────────────────────────────────────────────
# These apply ONLY to the FieldMaps ↔ GDACS crosswalk (the
# `match_gdacs_fieldmaps.py` script). The GADM script ignores them.
#
# The GDACS admin layer (`W_ADM_ADMIN2010_V2021`) was built from 2010
# boundaries and treats many small countries as a single polygon at
# admin-1. For those countries the only sensible FM crosswalk is at
# adm0 (whole-country) — see entries below.
#
# Resolution order in the script:
#   1. `[gdacs_overrides.<ISO3>]` (bridge-specific)
#   2. `[overrides.<ISO3>]` (shared/GADM defaults)
#   3. `[defaults]`

[gdacs_overrides.ATG]
fm_level = 0
note = "GDACS layer has 1 polygon for ATG; FM has 8. Collapse FM to country level."

[gdacs_overrides.BHS]
fm_level = 0
note = "GDACS layer has 1 polygon for BHS; FM has 32 districts. Collapse FM to country level."

[gdacs_overrides.BMU]
