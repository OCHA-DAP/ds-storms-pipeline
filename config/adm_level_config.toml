action = "Raise with FieldMaps maintainers — fix the two province-region swap rows in the BEL adm2 layer."

# ─────────────────────────────────────────────────────────────────────
# Per-row notes
# ─────────────────────────────────────────────────────────────────────
# Caveats attached to specific (iso3, fm_pcode) rows in the crosswalk.
# Used to surface known limitations of the 2010 GDACS boundaries when
# they intersect admin reforms that happened after 2010.
#
# Array-of-tables format so a single country can have multiple notes.
# The QMD loads these and renders them as visible callouts so colleagues
# reviewing the report can't miss them.
#
# `kind` is one of:
#   pre_split_boundary  — GDACS unit predates an admin split; same
#                         GDACS exposure number maps to multiple FM
#                         units. Do NOT sum across these FM rows.
#   rename              — pure naming change; same geometry,
#                         informational only.


[[per_row_notes]]
iso3 = "JAM"
fm_pcode = "JAM_2-20250729"
fm_name = "Pedro Bank"
gmi_admin = ""
kind = "fm_offshore_orphan"
note = "FM adm1 record for Pedro Bank — a submerged bank ~80 km SSW of Jamaica with two tiny emerging cays (~33 acres total). Jamaican sovereign territory but not assigned to any parish. FM puts the name in adm0_name ('Pedro Bank (Jam.)') rather than adm1_name. Not represented in GDACS, hence no_overlap. Effectively uninhabited so practical impact on exposure reporting is zero; safe to ignore at runtime."

[[per_row_notes]]
iso3 = "JAM"
fm_pcode = "JAM_3-20250729"
fm_name = "Morant Cays"
gmi_admin = ""
kind = "fm_offshore_orphan"
note = "FM adm1 record for Morant Cays — 4 small islets ~50 km SE of Jamaica. Jamaican sovereign territory but not a parish. FM puts the name in adm0_name ('Morant Cays (Jam.)') rather than adm1_name. Not represented in GDACS, hence no_overlap. Uninhabited; practical impact on exposure reporting is zero."

